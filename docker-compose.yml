version: '3.8'

services:
  db:
    image: postgres:15.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - my-network
    env_file:
      - .env
    ports:
      - "5433:5432"

  web:
    build: .
    command: sh -c "sleep 10 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./static:/var/www/static
      - ./media:/var/www/media
    networks:
      - my-network
    depends_on:
      - db
    env_file:
      - .env

  redis:
    image: redis:7.0.11
    networks:
      - my-network
